# Public product CI (quality + provenance; no publish)
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_pack:
        description: "Run release packaging validation (requires tag at HEAD)"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality-gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Generate build info
        run: node scripts/generate-build-info.mjs

      - name: Build
        run: pnpm -r --filter './apps/*' --filter './packages/*' run build

      - name: Typecheck
        run: pnpm -r --filter './apps/*' --filter './packages/*' run typecheck

      - name: Test
        run: pnpm test

      - name: Provenance unit tests
        run: pnpm run test:provenance

      - name: Release gate negative tests
        run: pnpm run test:release-gates

      - name: Production audit
        run: pnpm audit --prod

      - name: Development identity report
        run: node scripts/release/cli-validate.mjs

      - name: Public boundary check
        run: pnpm run public-boundary

  release-pack-validate:
    name: release-pack-validate
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_pack }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Release package (no publish)
        run: pnpm run package:release
        env:
          PAIRMESH_RELEASE_MODE: release

      - name: Upload release artifacts (CI only; not a GitHub Release)
        uses: actions/upload-artifact@v4
        with:
          name: aroko-release-pack
          path: dist-packages/releases/
          if-no-files-found: error
