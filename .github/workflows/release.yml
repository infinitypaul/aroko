# S23-7Q — Tag-triggered release packaging with separately gated npm staging
# and optional GitHub Release.
# Pack may run on annotated alpha tags or deliberate workflow_dispatch.
#
# actions/checkout@v4 (fetch-depth: 0) can overwrite refs/tags/<name> with the
# peeled commit after first fetching the annotated tag object. release-pack
# restores the annotated tag from origin and verifies via refs/tags/<name>.
# npm staging requires ALL of:
#   - workflow_dispatch with confirm_publish=true
#   - GitHub Environment `production-release` (tag policy + wait timer; timer ≠ approval)
#   - npm trusted publishing for @arokodev/cli on infinitypaul/aroko + this workflow
#     with stage-publish allowed and direct publish disallowed when configured
#   - `npm stage publish … --tag alpha` (never dist-tag latest for prereleases)
#   - operator `npm stage approve` with interactive 2FA after staging
# GitHub Release is a separate gate (confirm_github_release=true) and is NOT
# implied by confirm_publish / npm staging alone.
# Pushing a tag alone MUST NOT publish, stage, or create a GitHub Release.
name: release

on:
  push:
    tags:
      - "v*-alpha.*"
  workflow_dispatch:
    inputs:
      confirm_pack:
        description: "Pack release artifacts from the current ref (must be annotated alpha tag at HEAD)"
        type: boolean
        default: false
      confirm_publish:
        description: "Stage @arokodev/cli via npm trusted publishing (requires production-release; does NOT create a GitHub Release)"
        type: boolean
        default: false
      confirm_github_release:
        description: "Create a GitHub Release from packed artifacts (requires confirm_publish=true + production-release)"
        type: boolean
        default: false

# Least privilege at workflow level; publish job elevates only what it needs.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-pack:
    name: release-pack
    if: ${{ github.event_name == 'push' || inputs.confirm_pack || inputs.confirm_publish }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      commit: ${{ steps.tag.outputs.commit }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Explicit tag/branch ref from the event. fetch-depth 0 alone does NOT
          # guarantee the annotated tag object remains at refs/tags/<name>.
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Require infinitypaul/aroko + annotated alpha tag at HEAD
        id: tag
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Fail-closed: require tag ref for every pack path (tag push or dispatch).
          if [ "${{ github.ref_type }}" != "tag" ]; then
            echo "FAIL: release pack requires workflow run on a tag ref (got ref_type=${{ github.ref_type }} ref=${{ github.ref }})"
            exit 1
          fi
          node scripts/release/verify-annotated-release-tag.mjs --fetch-annotated-tag true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # npm trusted publishing requires Node >= 22.14 and npm >= 11.5.1
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Require npm for staged trusted publishing
        run: |
          set -euo pipefail
          # npm stage publish requires npm >= 11.15.0; OIDC trusted publishing requires >= 11.5.1
          npm install -g npm@^11.15.0
          NODE_V=$(node -v | sed 's/^v//')
          NPM_V=$(npm -v)
          echo "node=$NODE_V npm=$NPM_V"
          node -e '
            const [maj, min] = process.versions.node.split(".").map(Number);
            if (maj < 22 || (maj === 22 && min < 14)) {
              console.error("FAIL: trusted publishing requires Node.js >= 22.14 (got " + process.versions.node + ")");
              process.exit(1);
            }
          '
          NPM_V="$NPM_V" node -e '
            const v = process.env.NPM_V;
            const [maj, min] = v.split(".").map(Number);
            const ok = maj > 11 || (maj === 11 && min >= 15);
            if (!ok) {
              console.error("FAIL: staged publishing requires npm >= 11.15.0 (got " + v + ")");
              process.exit(1);
            }
          '

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Quality gates
        run: |
          set -euo pipefail
          node scripts/generate-build-info.mjs
          pnpm -r --filter './apps/*' --filter './packages/*' run build
          pnpm -r --filter './apps/*' --filter './packages/*' run typecheck
          pnpm test
          pnpm run test:provenance
          pnpm run test:release-gates
          pnpm audit --prod

      - name: Package once (release mode)
        run: pnpm run package:release
        env:
          AROKO_RELEASE_MODE: release
          PAIRMESH_RELEASE_MODE: release

      - name: Publish readiness dry-run
        run: pnpm run package:publish-check

      - name: Upload release artifact set
        uses: actions/upload-artifact@v4
        with:
          name: aroko-release-${{ steps.tag.outputs.tag }}
          path: dist-packages/releases/
          if-no-files-found: error

      - name: Stop before external publish (default)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.confirm_publish != true }}
        run: |
          echo "Release pack complete. npm stage / GitHub Release not performed."
          echo "npm staging requires workflow_dispatch confirm_publish=true + production-release + tag ref."
          echo "GitHub Release additionally requires confirm_github_release=true."

  release-publish:
    name: release-publish
    needs: release-pack
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_publish == true && github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production-release
    permissions:
      # contents:write is only consumed by the optional GitHub Release step.
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout exact packed commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.release-pack.outputs.commit }}

      - name: Download packed artifacts
        uses: actions/download-artifact@v4
        with:
          name: aroko-release-${{ needs.release-pack.outputs.tag }}
          path: dist-packages/releases/

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # npm trusted publishing requires Node >= 22.14 and npm >= 11.5.1
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Require npm for staged trusted publishing
        run: |
          set -euo pipefail
          # npm stage publish requires npm >= 11.15.0; OIDC trusted publishing requires >= 11.5.1
          npm install -g npm@^11.15.0
          NODE_V=$(node -v | sed 's/^v//')
          NPM_V=$(npm -v)
          echo "node=$NODE_V npm=$NPM_V"
          node -e '
            const [maj, min] = process.versions.node.split(".").map(Number);
            if (maj < 22 || (maj === 22 && min < 14)) {
              console.error("FAIL: trusted publishing requires Node.js >= 22.14 (got " + process.versions.node + ")");
              process.exit(1);
            }
          '
          NPM_V="$NPM_V" node -e '
            const v = process.env.NPM_V;
            const [maj, min] = v.split(".").map(Number);
            const ok = maj > 11 || (maj === 11 && min >= 15);
            if (!ok) {
              console.error("FAIL: staged publishing requires npm >= 11.15.0 (got " + v + ")");
              process.exit(1);
            }
          '

      - name: Verify @arokodev/cli artifact identity (fail closed)
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          if [ "$REPO" != "infinitypaul/aroko" ]; then
            echo "FAIL: publish must run on infinitypaul/aroko (got $REPO)"
            exit 1
          fi
          if [ "${{ github.repository_id }}" != "1413375921" ]; then
            echo "FAIL: unexpected repository id ${{ github.repository_id }}"
            exit 1
          fi
          TAG=${{ needs.release-pack.outputs.tag }}
          EXPECTED_COMMIT=${{ needs.release-pack.outputs.commit }}
          ACTUAL_COMMIT=$(git rev-parse HEAD)
          if [ "$ACTUAL_COMMIT" != "$EXPECTED_COMMIT" ]; then
            echo "FAIL: checkout commit $ACTUAL_COMMIT != packed commit $EXPECTED_COMMIT"
            exit 1
          fi
          HEAD_TAG=$(git describe --exact-match --tags HEAD)
          if [ "$HEAD_TAG" != "$TAG" ]; then
            echo "FAIL: HEAD tag $HEAD_TAG != packed tag $TAG"
            exit 1
          fi
          TGZ=$(ls dist-packages/releases/*/aroko-cli-*.tgz | head -1)
          test -n "$TGZ"
          DIR=$(dirname "$TGZ")
          MANIFEST="$DIR/release-manifest.json"
          NOTES="$DIR/RELEASE_NOTES.md"
          test -f "$MANIFEST"
          test -f "$NOTES"
          eval "$(tar -xOf "$TGZ" package/package.json | node -e '
            const fs = require("fs");
            const p = JSON.parse(fs.readFileSync(0, "utf8"));
            if (p.name !== "@arokodev/cli") {
              console.error("FAIL: packed package name must be @arokodev/cli (got " + p.name + ")");
              process.exit(1);
            }
            if (p.version !== "0.1.0-alpha.1") {
              console.error("FAIL: packed package version must be 0.1.0-alpha.1 (got " + p.version + ")");
              process.exit(1);
            }
            if (p.bin?.aroko !== "./dist/index.js") {
              console.error("FAIL: packed package must expose aroko bin");
              process.exit(1);
            }
            if (p.bin?.pairmesh !== "./dist/index.js") {
              console.error("FAIL: packed package must expose pairmesh bin");
              process.exit(1);
            }
            console.log("NAME=" + JSON.stringify(p.name));
            console.log("VERSION=" + JSON.stringify(p.version));
          ')"
          EXPECTED_SHA=$(node -e 'const fs=require("fs"); const m=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); process.stdout.write(m.artifacts[0].sha256)' "$MANIFEST")
          ACTUAL_SHA=$(sha256sum "$TGZ" | awk '{print $1}')
          if [ "$EXPECTED_SHA" != "$ACTUAL_SHA" ]; then
            echo "FAIL: tarball SHA256 does not match release-manifest.json"
            exit 1
          fi
          MANIFEST_TAG=$(node -e 'const fs=require("fs"); const m=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); process.stdout.write(m.gitTag||"")' "$MANIFEST")
          MANIFEST_COMMIT=$(node -e 'const fs=require("fs"); const m=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); process.stdout.write(m.gitCommit||"")' "$MANIFEST")
          if [ "$MANIFEST_TAG" != "$TAG" ]; then
            echo "FAIL: manifest gitTag ($MANIFEST_TAG) does not match packed tag ($TAG)"
            exit 1
          fi
          if [ "$MANIFEST_COMMIT" != "$EXPECTED_COMMIT" ]; then
            echo "FAIL: manifest gitCommit ($MANIFEST_COMMIT) does not match packed commit ($EXPECTED_COMMIT)"
            exit 1
          fi
          echo "Verified ${NAME}@${VERSION} artifact + manifest for $TAG @ $EXPECTED_COMMIT"

      - name: Stage @arokodev/cli (OIDC trusted publishing — stage only)
        run: |
          set -euo pipefail
          echo "Stage step is intentionally gated and does NOT make the package installable."
          echo "Requires: npm trusted publisher for @arokodev/cli on infinitypaul/aroko + this workflow"
          echo "with stage-publish allowed and direct publish disallowed,"
          echo "environment production-release (wait timer is NOT human approval),"
          echo "confirm_publish=true, and tag-ref workflow_dispatch."
          echo "After staging, an operator must run: npm stage approve <stage-id> (interactive 2FA)."
          echo "Do not use a long-lived NPM_TOKEN when trusted publishing is available."
          if [ -n "${NODE_AUTH_TOKEN:-}" ] || [ -n "${NPM_TOKEN:-}" ]; then
            echo "FAIL: long-lived npm token env must not be present for trusted publishing"
            exit 1
          fi
          TGZ=$(ls dist-packages/releases/*/aroko-cli-*.tgz | head -1)
          test -n "$TGZ"
          # Explicit alpha dist-tag is mandatory for 0.1.0-alpha.* (npm errors without --tag).
          # Never use dist-tag latest for this prerelease. Never direct npm publish from CI.
          # OIDC trusted publisher must allow stage-publish only (disallow direct publish).
          npm stage publish "$TGZ" --access public --tag alpha

      - name: Create GitHub Release from same artifacts
        if: ${{ inputs.confirm_github_release == true }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Separately gated from npm staging — confirm_publish alone must NOT create a Release.
          TAG=${{ needs.release-pack.outputs.tag }}
          DIR=$(dirname "$(ls dist-packages/releases/*/aroko-cli-*.tgz | head -1)")
          gh release create "$TAG" \
            --title "Aroko $TAG" \
            --notes-file "$DIR/RELEASE_NOTES.md" \
            "$DIR"/*
